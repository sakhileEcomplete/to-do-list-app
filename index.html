<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>To-Do List</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f5f5f5;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 48px 16px;
      color: #1a1a1a;
    }

    .container {
      width: 100%;
      max-width: 520px;
    }

    h1 {
      font-size: 2rem;
      font-weight: 700;
      margin-bottom: 24px;
      color: #111;
    }

    .input-row {
      display: flex;
      gap: 8px;
      margin-bottom: 24px;
    }

    .input-row input {
      flex: 1;
      padding: 12px 16px;
      font-size: 1rem;
      border: 1.5px solid #ddd;
      border-radius: 8px;
      background: #fff;
      outline: none;
      transition: border-color 0.15s;
    }

    .input-row input:focus {
      border-color: #6366f1;
    }

    .input-row button {
      padding: 12px 20px;
      font-size: 1rem;
      font-weight: 600;
      background: #6366f1;
      color: #fff;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      white-space: nowrap;
      transition: background 0.15s;
    }

    .input-row button:hover {
      background: #4f46e5;
    }

    .filters {
      display: flex;
      gap: 6px;
      margin-bottom: 16px;
    }

    .filter-btn {
      padding: 6px 14px;
      font-size: 0.875rem;
      border: 1.5px solid #ddd;
      border-radius: 20px;
      background: transparent;
      cursor: pointer;
      color: #555;
      transition: all 0.15s;
    }

    .filter-btn.active {
      background: #6366f1;
      border-color: #6366f1;
      color: #fff;
    }

    .task-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .task-item {
      display: flex;
      align-items: center;
      gap: 12px;
      background: #fff;
      border: 1.5px solid #e5e5e5;
      border-radius: 10px;
      padding: 14px 16px;
      transition: opacity 0.15s;
    }

    .task-item.done {
      opacity: 0.55;
    }

    .task-check {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      border: 2px solid #ccc;
      background: transparent;
      cursor: pointer;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s;
    }

    .task-check.checked {
      background: #6366f1;
      border-color: #6366f1;
    }

    .task-check.checked::after {
      content: '';
      display: block;
      width: 5px;
      height: 9px;
      border: 2px solid #fff;
      border-top: none;
      border-left: none;
      transform: rotate(45deg) translateY(-1px);
    }

    .task-text {
      flex: 1;
      font-size: 1rem;
      line-height: 1.4;
      word-break: break-word;
    }

    .task-item.done .task-text {
      text-decoration: line-through;
      color: #999;
    }

    .delete-btn {
      background: none;
      border: none;
      cursor: pointer;
      color: #ccc;
      font-size: 1.1rem;
      line-height: 1;
      padding: 2px 4px;
      border-radius: 4px;
      transition: color 0.15s;
      flex-shrink: 0;
    }

    .delete-btn:hover {
      color: #ef4444;
    }

    .empty-state {
      text-align: center;
      color: #aaa;
      font-size: 0.95rem;
      padding: 40px 0;
    }

    .footer {
      margin-top: 16px;
      font-size: 0.85rem;
      color: #aaa;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .clear-btn {
      background: none;
      border: none;
      cursor: pointer;
      color: #aaa;
      font-size: 0.85rem;
      padding: 0;
      transition: color 0.15s;
    }

    .clear-btn:hover {
      color: #ef4444;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>My Tasks</h1>

    <div class="input-row">
      <input type="text" id="task-input" placeholder="Add a new task..." maxlength="200" />
      <button id="add-btn">Add</button>
    </div>

    <div class="filters">
      <button class="filter-btn active" data-filter="all">All</button>
      <button class="filter-btn" data-filter="active">Active</button>
      <button class="filter-btn" data-filter="done">Completed</button>
    </div>

    <ul class="task-list" id="task-list"></ul>

    <div class="footer" id="footer" style="display:none;">
      <span id="count-label"></span>
      <button class="clear-btn" id="clear-btn">Clear completed</button>
    </div>
  </div>

  <script>
    let tasks = JSON.parse(localStorage.getItem('tasks') || '[]');
    let filter = 'all';

    const taskInput = document.getElementById('task-input');
    const addBtn = document.getElementById('add-btn');
    const taskList = document.getElementById('task-list');
    const footer = document.getElementById('footer');
    const countLabel = document.getElementById('count-label');
    const clearBtn = document.getElementById('clear-btn');
    const filterBtns = document.querySelectorAll('.filter-btn');

    function save() {
      localStorage.setItem('tasks', JSON.stringify(tasks));
    }

    function render() {
      const filtered = tasks.filter(t => {
        if (filter === 'active') return !t.done;
        if (filter === 'done') return t.done;
        return true;
      });

      taskList.innerHTML = '';

      if (filtered.length === 0) {
        const empty = document.createElement('li');
        empty.className = 'empty-state';
        empty.textContent = filter === 'done'
          ? 'No completed tasks yet.'
          : filter === 'active'
          ? 'No active tasks — great job!'
          : 'No tasks yet. Add one above!';
        taskList.appendChild(empty);
      } else {
        filtered.forEach(task => {
          const li = document.createElement('li');
          li.className = 'task-item' + (task.done ? ' done' : '');

          const check = document.createElement('div');
          check.className = 'task-check' + (task.done ? ' checked' : '');
          check.addEventListener('click', () => toggle(task.id));

          const text = document.createElement('span');
          text.className = 'task-text';
          text.textContent = task.text;

          const del = document.createElement('button');
          del.className = 'delete-btn';
          del.textContent = '✕';
          del.title = 'Delete task';
          del.addEventListener('click', () => remove(task.id));

          li.appendChild(check);
          li.appendChild(text);
          li.appendChild(del);
          taskList.appendChild(li);
        });
      }

      const activeCount = tasks.filter(t => !t.done).length;
      const doneCount = tasks.filter(t => t.done).length;

      if (tasks.length > 0) {
        footer.style.display = 'flex';
        countLabel.textContent = activeCount === 1 ? '1 task left' : `${activeCount} tasks left`;
        clearBtn.style.visibility = doneCount > 0 ? 'visible' : 'hidden';
      } else {
        footer.style.display = 'none';
      }
    }

    function addTask() {
      const text = taskInput.value.trim();
      if (!text) return;
      tasks.unshift({ id: Date.now(), text, done: false });
      taskInput.value = '';
      save();
      render();
    }

    function toggle(id) {
      tasks = tasks.map(t => t.id === id ? { ...t, done: !t.done } : t);
      save();
      render();
    }

    function remove(id) {
      tasks = tasks.filter(t => t.id !== id);
      save();
      render();
    }

    addBtn.addEventListener('click', addTask);
    taskInput.addEventListener('keydown', e => {
      if (e.key === 'Enter') addTask();
    });

    clearBtn.addEventListener('click', () => {
      tasks = tasks.filter(t => !t.done);
      save();
      render();
    });

    filterBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        filter = btn.dataset.filter;
        filterBtns.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        render();
      });
    });

    render();
  </script>
</body>
</html>
