<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>To-Do List</title>

  <!-- Replace the empty <style></style> with this -->
<link rel="stylesheet" href="style.css" />

<!-- Replace the script tag with this -->
<script src="script.js"></script>

</head>
<body>
  <div class="container">
    <h1>My Tasks</h1>

    <div class="input-row">
      <input type="text" id="task-input" placeholder="Add a new task..." maxlength="200" />
      <button id="add-btn">Add</button>
    </div>

    <div class="filters">
      <button class="filter-btn active" data-filter="all">All</button>
      <button class="filter-btn" data-filter="active">Active</button>
      <button class="filter-btn" data-filter="done">Completed</button>
    </div>

    <ul class="task-list" id="task-list"></ul>

    <div class="footer" id="footer" style="display:none;">
      <span id="count-label"></span>
      <button class="clear-btn" id="clear-btn">Clear completed</button>
    </div>
  </div>

  <script src = "script.js">
  </script>
</body>
</html>
